name: Expand core implementation tasks
on:
  push:
    branches: [metadata/core-breakdown-2026-11-04]
permissions:
  contents: read
  issues: write
concurrency:
  group: core-breakdown
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: node --check scripts/expand-core-tasks.mjs
      - run: node scripts/expand-core-tasks.mjs
